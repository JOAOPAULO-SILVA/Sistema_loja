{% with rota=request.resolver_match.url_name %}
<header class="navbar bg-base-100 shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl flex-wrap items-center gap-x-4 gap-y-1 px-2">
        <a href="{% url 'estoque:listar_produtos' %}" class="btn btn-ghost text-lg font-bold text-primary">Meu Estoque</a>
        <nav aria-label="Navegação principal" class="order-last w-full sm:order-none sm:w-auto sm:flex-1">
            <ul class="menu menu-horizontal gap-1 p-0">
                <li><a href="{% url 'estoque:listar_produtos' %}"{% if rota == 'listar_produtos' %} class="menu-active" aria-current="page"{% endif %}>Produtos</a></li>
                <li><a href="{% url 'estoque:listar_categorias' %}"{% if rota == 'listar_categorias' %} class="menu-active" aria-current="page"{% endif %}>Categorias</a></li>
                <li><a href="{% url 'estoque:listar_movimentacoes' %}"{% if rota == 'listar_movimentacoes' %} class="menu-active" aria-current="page"{% endif %}>Movimentações</a></li>
            </ul>
        </nav>
        <form method="post" action="{% url 'logout' %}" class="ml-auto flex items-center gap-2">
            {% csrf_token %}
            <span class="text-sm opacity-70">{{ user.username }}</span>
            <button class="btn btn-ghost btn-sm" type="submit">Sair</button>
        </form>
    </div>
</header>
{% endwith %}
