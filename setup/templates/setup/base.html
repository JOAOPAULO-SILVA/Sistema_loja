{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Estoque{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'setup/app.css' %}">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
    {% include 'setup/navbar.html' %}
    <main class="mx-auto max-w-6xl px-4 py-6 sm:py-8">
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %} mb-4" role="alert">
                {{ message }}
            </div>
        {% endfor %}
        {% block body_content %}
        {% endblock %}
    </main>
</body>
</html>
