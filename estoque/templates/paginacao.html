{% if pagina.paginator.num_pages > 1 %}
    <nav class="mt-5 flex items-center justify-center gap-3" aria-label="Paginação">
        {% if pagina.has_previous %}
            <a class="btn btn-sm" href="?{% if parametros %}{{ parametros }}&{% endif %}page={{ pagina.previous_page_number }}">Anterior</a>
        {% endif %}
        <span class="text-sm">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
        {% if pagina.has_next %}
            <a class="btn btn-sm" href="?{% if parametros %}{{ parametros }}&{% endif %}page={{ pagina.next_page_number }}">Próxima</a>
        {% endif %}
    </nav>
{% endif %}
